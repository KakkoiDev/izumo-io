name: Rebuild p2p lesson preview

on:
  push:
    branches:
      - teach/p2p-core-multiplayer

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teach/p2p-core-multiplayer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Build site
        run: python website/build.py
      - name: Verify p2p-core lesson output
        run: |
          grep -q "p2p-core@v0.1.0" docs/lessons/a12.md
          grep -q "room.onMessage('say'" docs/lessons/a13.md
          grep -q "p2p-core@v0.1.0" docs/lessons/a12.html
      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Docs already in sync"
            exit 0
          fi
          git commit -m "Rebuild school site for p2p-core lessons"
          git push origin HEAD:teach/p2p-core-multiplayer
