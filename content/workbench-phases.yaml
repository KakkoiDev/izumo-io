# Phase metadata for the Workbench track. Same shape as ai-phases.yaml.
# The course teaches building apps with Pi Workbench (the pi-local-harness repository) on its one stack:
# FastAPI + Jinja, htmx 4, Basecoat + Tailwind, SQLite, typed Python, English and Japanese.
# It links to the T, A and R lessons for depth instead of repeating them.

