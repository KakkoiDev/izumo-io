name: Translate content (JA + PT)

# Fills missing translations under content/ without ever overwriting
# existing translations. Triggers on pushes to master that touch
# content/, and on manual dispatch so we can bulk-seed new languages.

on:
  push:
    branches: [master]
    paths:
      - 'content/**.md'
      - 'content/*.yaml'
  workflow_dispatch:

# Serialize: if a translation run is already going, queue this one.
concurrency:
  group: translate-content
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install google-genai -r requirements.txt

      - name: Run idempotent translator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/translate_content.py

      # FIX 1: rebuild the site in the same PR. The workflow used to update
      # content/ only, so JA/PT pages kept rendering English until a human
      # remembered to run `make build` - which is how a month of lost
      # translations went unnoticed.
      - name: Rebuild the site
        run: python website/build.py

      - name: Open a PR with the translations and rebuilt site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/ docs/
          if git diff --staged --quiet; then
            echo "Nothing to do: no new translations and the site is already in sync."
            exit 0
          fi

          # master requires a pull request (ruleset "Protect Master") and the
          # Actions bot is not on the bypass list, so pushing straight to master
          # is rejected. Push a branch and open a PR instead.
          BRANCH="auto/translations-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "Auto-translate content: fill missing JA + PT, rebuild site"
          git push origin "$BRANCH"

          # Creating the PR needs Settings > Actions > General > "Allow GitHub
          # Actions to create and approve pull requests". If that is off, the
          # branch is still pushed - we just hand a human the link instead of
          # failing and losing the work.
          if gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "Auto-translate content: fill missing JA + PT" \
              --body "Generated by the translate-content workflow: missing translations plus the rebuilt \`docs/\`, so merging publishes everything at once. Existing translations are never overwritten."; then
            echo "PR opened."
          else
            URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${BRANCH}?expand=1"
            echo "::warning::Could not open the PR automatically (Actions may not be allowed to create PRs). The translations are safe on branch $BRANCH - open it here: $URL"
            echo "### Translations ready, PR not opened automatically" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch \`$BRANCH\` is pushed. [Open the pull request]($URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # FIX 2: fail loudly. This runs even when earlier steps fail, and turns a
      # silent gap into a red run with the exact filenames. The old workflow
      # could lose every translation and still look unremarkable in the run list.
      - name: Verify every lesson has JA + PT
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, sys
          missing = []
          for f in glob.glob('content/**/*.md', recursive=True):
              if '.ja.' in f or '.pt.' in f:
                  continue
              for lang in ('ja', 'pt'):
                  sibling = f[:-3] + f'.{lang}.md'
                  if not os.path.exists(sibling):
                      missing.append(sibling)
          if missing:
              print(f"::error::{len(missing)} translation(s) missing - the pipeline did not deliver:")
              for m in sorted(missing):
                  print(f"::error file={m}::missing translation: {m}")
              sys.exit(1)
          print("All lessons have JA + PT.")
          EOF
