name: Translate Markdown to Japanese

# NOTE: the content/ tree has its own translator (see translate-content.yml)
# which is idempotent and handles JA + PT. This legacy workflow only covers
# hand-written markdown outside content/ and outside generated docs/.
# It must never translate source lessons or generated site mirrors.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.md'
      - '!content/**.md'
      - '!docs/**.md'

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install google-genai

    - name: Get changed hand-written markdown files
      id: changed-files
      shell: bash
      run: |
        git fetch origin ${{ github.base_ref }}
        changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
          | grep '\.md$' \
          | grep -v '_jp\.md$' \
          | grep -v '^content/' \
          | grep -v '^docs/' \
          || true)
        echo "files<<EOF" >> "$GITHUB_OUTPUT"
        echo "$changed_files" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Translate files
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
      run: |
        cat << 'SCRIPT' > translate.py
        import os
        from pathlib import Path
        from google import genai

        files = [f for f in os.environ.get('CHANGED_FILES', '').splitlines() if f.strip()]
        translated_files = []
        if files:
            client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
            for file_path in files:
                if not os.path.exists(file_path):
                    continue
                print(f"Translating {file_path}...")
                content = Path(file_path).read_text(encoding='utf-8')
                prompt = f'''Translate the following markdown document to Japanese.
Preserve all markdown formatting, code blocks, links, and structure exactly.
Only translate the text content, not code, URLs, or markdown syntax.

Document:
{content}'''
                response = client.models.generate_content(
                    model='gemini-2.5-flash',
                    contents=prompt,
                )
                path = Path(file_path)
                jp_path = path.parent / (path.stem + '_jp' + path.suffix)
                jp_path.write_text(response.text, encoding='utf-8')
                translated_files.append(str(jp_path))
                print(f"Created {jp_path}")

        Path('translated_files.txt').write_text('\n'.join(translated_files), encoding='utf-8')
        SCRIPT
        python translate.py

    - name: Commit translations
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        while IFS= read -r file; do
          [ -n "$file" ] && git add -- "$file"
        done < translated_files.txt

        if git diff --staged --quiet; then
          echo "No translations to commit"
        else
          translated_list=$(cat translated_files.txt)
          git commit -m "Autogenerate Japanese translation" -m "$translated_list"
          git push
        fi
